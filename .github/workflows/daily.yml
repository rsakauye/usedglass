name: Daily scrape, build & preview deploy

on:
  schedule:
    # 12:00 UTC = 6:00 a.m. MDT (summer) / 5:00 a.m. MST (winter). GitHub cron is UTC-only.
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "site/**", "tests/**", ".github/workflows/**"]

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # scrape-failure alerts (scraper/alert.py)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -v tests.test_normalize tests.test_alert tests.test_currency

      - name: Scrape dealers (+ eBay if keys are set) and compute deals
        id: scrape
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
        run: python -m scraper.run

      # Opens/updates one "scrape-alert" issue when a dealer errors, returns 0 listings or collapses;
      # closes it automatically once every feed is healthy again. Never fails the build itself.
      - name: Scrape-failure alert (GitHub issue)
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: python -m scraper.alert

      - name: Commit data
        run: |
          git config user.name "usedglass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: daily update $(TZ=America/Edmonton date +%F)"
          # Another run may have pushed data since checkout (e.g. back-to-back pushes). This run's data is the
          # newest, so on a data/ conflict keep ours (-X theirs = the commit being replayed during rebase).
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: JS unit tests (kit builder, vintage classifier)
        run: node --test tests/test_mykit.mjs tests/test_vintage.mjs

      - name: Build site (GitHub Pages preview base path)
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_KIT_FORM_ID: ${{ vars.KIT_FORM_ID }}
          PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG || 'usedglass-20' }}
        run: |
          npm ci
          npm run build

      - name: Publish preview to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: usedglass-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "preview: ${{ github.sha }}"

      # ---- Cloudflare Pages (production: usedglass.ca / usedglass.pages.dev) ----
      # Runs only when the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist;
      # otherwise it is skipped and the GitHub Pages preview above remains the only deploy.
      - name: Build site for Cloudflare Pages (root base path)
        if: env.CF_DEPLOY == 'true'
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://usedglass.ca' }}
          BASE_PATH: /
          PUBLIC_KIT_FORM_ID: ${{ vars.KIT_FORM_ID }}
          PUBLIC_AMAZON_TAG: ${{ vars.AMAZON_TAG || 'usedglass-20' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_DEPLOY == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the project on first run (no-op error if it already exists), then uploads dist/.
          npx --yes wrangler@4 pages project create usedglass --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=usedglass --branch=main --commit-dirty=true

      - name: IndexNow ping (changed URLs only)
        if: success() && env.CF_DEPLOY == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs

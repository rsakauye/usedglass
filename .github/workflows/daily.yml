name: Daily scrape, build & preview deploy

on:
  schedule:
    # 12:00 UTC = 6:00 a.m. MDT (summer) / 5:00 a.m. MST (winter). GitHub cron is UTC-only.
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "site/**", "tests/**", ".github/workflows/**"]

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -v tests.test_normalize

      - name: Scrape dealers (+ eBay if keys are set) and compute deals
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
        run: python -m scraper.run

      - name: Commit data
        run: |
          git config user.name "usedglass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: daily update $(TZ=America/Edmonton date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site (GitHub Pages preview base path)
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Publish preview to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: usedglass-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "preview: ${{ github.sha }}"
